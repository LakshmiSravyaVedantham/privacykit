[package]
name = "privacykit"
version = "0.1.0"
edition = "2021"
description = "Privacy toolkit in Rust — track your trackers, find ghost accounts, monitor for breaches"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
scraper = "0.21"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
sha1 = "0.10"
anyhow = "1"
dirs = "5"
